    // ---------------------------------------------------------------------
    // Dashboard
    // ---------------------------------------------------------------------

    function periodBounds(period) {
      const now = new Date();
      let start;
      if (period === "day") { start = new Date(now); start.setHours(0, 0, 0, 0); }
      else if (period === "week") start = new Date(now.getTime() - 7 * 24 * 3600 * 1000); // rolling 7 days, not calendar week
      else if (period === "month") start = new Date(now.getTime() - 30 * 24 * 3600 * 1000); // rolling 30 days, not calendar month
      else start = new Date(now.getFullYear(), 0, 1); // ytd
      return { start, end: now };
    }
    function inPeriod(dateStr, bounds) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      return d >= bounds.start && d <= bounds.end;
    }

    async function renderDashboard() {
      const bounds = periodBounds(dashboardPeriod);

      // ---- Production ("brought in from fields") by crop, in period.
      // Two sources: field-to-bin loads (the usual path), AND hauls that
      // went straight from a field to a buyer, skipping the bin entirely
      // (Deliveries' "From a field" option) — those bushels never appear
      // in `loads` at all, so without this they'd silently vanish from
      // Production while still counting on the Delivered side. ----
      const production = {}; // crop -> { total, byStatus }
      function addProduction(crop, status, bu) {
        const c = crop || "Unknown";
        if (!production[c]) production[c] = { total: 0, byStatus: {} };
        production[c].total += bu;
        const st = status || "unknown";
        production[c].byStatus[st] = (production[c].byStatus[st] || 0) + bu;
      }
      allLoads.forEach((l) => {
        if (!inPeriod(l.logged_at, bounds)) return;
        addProduction(l.crop_raw, l.status, toBushels(l));
      });
      allHauls.forEach((h) => {
        if (h.originType !== "field") return; // bin-origin hauls came FROM a loads row already counted above
        if (h.checkStatus === "none") return; // no ticket yet — nothing to count
        if (!inPeriod(h.departed_at, bounds)) return;
        addProduction(h.crop, h.originStatus, (h._ticket && h._ticket.net_bushels) || 0);
      });

      // ---- Delivered (Hauled Out) by crop, in period ----
      const delivered = {};
      let reviewQueueCount = 0; // current state, not period-scoped
      allHauls.forEach((h) => {
        if (h.checkStatus === "review") reviewQueueCount++;
        if (h.checkStatus === "none") return; // no ticket entered — nothing delivered to count yet
        if (!inPeriod(h.departed_at, bounds)) return;
        const crop = h.crop || "Unknown";
        const bu = (h._ticket && h._ticket.net_bushels) || 0;
        if (!delivered[crop]) delivered[crop] = { total: 0, byStatus: {} };
        delivered[crop].total += bu;
        const st = h.originStatus || "unknown";
        delivered[crop].byStatus[st] = (delivered[crop].byStatus[st] || 0) + bu;
      });

      // ---- Dollars ----
      const settledInPeriod = allSettlements.filter((s) => inPeriod(s.settlement_date, bounds));
      const settledAmount = settledInPeriod.reduce((sum, s) => sum + (s.total_amount || 0), 0);
      const unpaidSettlements = allSettlements.filter((s) => !s.paid);
      const unpaidTotal = unpaidSettlements.reduce((sum, s) => sum + (s.total_amount || 0), 0);

      // Estimated $ for hauls delivered in this period, priced only where a
      // contract is actually assigned — an unassigned load has no reliable
      // price in this system, so it's counted separately, not guessed at.
      // A haul can now be SPLIT across more than one contract (e.g. Valero
      // closing out an old contract with part of a load and applying the
      // rest to a new one) — so this prices each allocation at ITS OWN
      // contract's rate, rather than assuming one contract per haul.
      const { data: ctRows, error: ctErr } = await supabase.from("contract_tickets").select("shipment_client_id, contract_id, bushels");
      const allocationsByHaul = new Map();
      (ctRows || []).forEach((row) => {
        if (!allocationsByHaul.has(row.shipment_client_id)) allocationsByHaul.set(row.shipment_client_id, []);
        allocationsByHaul.get(row.shipment_client_id).push({ contractId: row.contract_id, bushels: row.bushels });
      });
      const contractPriceById = new Map(allContracts.map((c) => [c.id, c.cash_price]));
      let estimatedAmount = 0, unpricedBushels = 0, unpricedCount = 0;
      const haulsInPeriod = allHauls.filter((h) => h.checkStatus !== "none" && inPeriod(h.departed_at, bounds));
      haulsInPeriod.forEach((h) => {
        const totalBu = (h._ticket && h._ticket.net_bushels) || 0;
        let pricedBu = 0;
        (allocationsByHaul.get(h.haulId) || []).forEach((a) => {
          const price = contractPriceById.get(a.contractId);
          if (price != null) { estimatedAmount += a.bushels * price; pricedBu += a.bushels; }
        });
        const unpriced = Math.max(0, totalBu - pricedBu); // unallocated remainder, or allocated to a contract with no price set
        if (unpriced > 0.001) { unpricedBushels += unpriced; unpricedCount++; }
      });

      // ---- Contracts (current state — not period-scoped) ----
      const openContracts = allContracts.filter((c) => c.delivered_bushels < c.bushels);
      const totalContracted = openContracts.reduce((sum, c) => sum + c.bushels, 0);
      const totalContractedDelivered = openContracts.reduce((sum, c) => sum + c.delivered_bushels, 0);

      // ---- Render ----
      const crops = [...new Set([...Object.keys(production), ...Object.keys(delivered)])].sort();
      const fmtBu = (n) => Math.round(n).toLocaleString() + " bu";
      const fmtUsd = (n) => "$" + Math.round(n).toLocaleString();
      const statusLine = (byStatus) => Object.entries(byStatus).map(([st, bu]) => `${st}: ${fmtBu(bu)}`).join(" · ") || "—";
      const periodLabel = { day: "today", week: "the last 7 days", month: "the last 30 days", ytd: "year to date" }[dashboardPeriod];

      let html = `<div class="dash-section-title">Brought in from fields vs. delivered — ${escapeHtml(periodLabel)}</div>`;
      if (crops.length === 0) {
        html += `<div style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">Nothing recorded in this period.</div>`;
      } else {
        html += `<div class="dash-grid">`;
        crops.forEach((crop) => {
          const prod = production[crop] || { total: 0, byStatus: {} };
          const del = delivered[crop] || { total: 0, byStatus: {} };
          const pct = prod.total > 0 ? Math.min(100, Math.round((del.total / prod.total) * 100)) : del.total > 0 ? 100 : 0;
          html += `
            <div class="dash-card">
              <div class="dash-card-title">${escapeHtml(crop)}</div>
              <div class="dash-stat-row"><span>Brought in </span><span class="driver-val">${fmtBu(prod.total)}</span></div>
              <div class="meta" style="margin-bottom:8px;">${escapeHtml(statusLine(prod.byStatus))}</div>
              <div class="dash-stat-row"><span>Delivered </span><span class="ai-val">${fmtBu(del.total)}</span></div>
              <div class="meta" style="margin-bottom:8px;">${escapeHtml(statusLine(del.byStatus))}</div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              <div class="meta">${pct}% of what came in has been delivered</div>
            </div>`;
        });
        html += `</div>`;
      }

      const totalDeliveredBu = haulsInPeriod.reduce((sum, h) => sum + ((h._ticket && h._ticket.net_bushels) || 0), 0);
      html += `
        <div class="dash-section-title" style="margin-top:24px;">Hauls &amp; dollars — ${escapeHtml(periodLabel)}</div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-card-title">Loads hauled out</div>
            <div class="dash-big-num">${haulsInPeriod.length}</div>
            <div class="meta">${fmtBu(totalDeliveredBu)} total</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-title">Settled (actual)</div>
            <div class="dash-big-num">${fmtUsd(settledAmount)}</div>
            <div class="meta">${settledInPeriod.length} settlement${settledInPeriod.length === 1 ? "" : "s"} in this period</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-title">Estimated (from contract price)</div>
            <div class="dash-big-num">${fmtUsd(estimatedAmount)}</div>
            <div class="meta">${unpricedCount > 0 ? `+ ${fmtBu(unpricedBushels)} not yet priced (no contract assigned)` : "every load this period is priced"}</div>
          </div>
        </div>`;

      // ---- Share-crop: what's owed to each partner, current state.
      // Only counts loads flagged "we got paid the whole load" (the
      // elevator didn't apply the split) — a load where the elevator DID
      // pay out net of the partner's share owes nothing further. A
      // settlement's dollar figure covers several loads at once, so a
      // single load's value is estimated by prorating that settlement's
      // total by bushels — same honesty as the "Estimated" dollar figure
      // above, not treated as exact. "Since last settled" uses each
      // settlement's own date against the partner's most recent
      // partner_settlements entry (there's no per-payment ledger here —
      // Ben confirmed this gets netted against other things like manure
      // and trucking outside the system, so just a running total + a
      // reset point is enough). ----
      const { data: psRows, error: psErr } = await supabase.from("partner_settlements").select("*").order("settled_at", { ascending: false });
      const lastSettledByPartner = new Map();
      (psRows || []).forEach((row) => {
        const cur = lastSettledByPartner.get(row.partner_id);
        if (!cur || row.settled_at > cur) lastSettledByPartner.set(row.partner_id, row.settled_at);
      });
      const owedByPartner = new Map(); // partnerId -> { owed, undecidedCount }
      allSettlements.forEach((s) => {
        const settlementBushels = s.assignments.reduce((sum, a) => {
          const h = allHauls.find((x) => x.haulId === a.shipmentClientId);
          return sum + ((h && h._ticket && h._ticket.net_bushels) || 0);
        }, 0);
        s.assignments.forEach((a) => {
          const h = allHauls.find((x) => x.haulId === a.shipmentClientId);
          if (!h || !h.splitPartnerId) return;
          const lastSettled = lastSettledByPartner.get(h.splitPartnerId);
          // Cutoff is the settlement's uploaded_at (when it was actually
          // entered into GrainChain) rather than settlement_date (a date
          // the user types in from the paper, with no reliable
          // relationship to "now") — "mark settled" means "everything on
          // file as of right now," and uploaded_at is what's actually
          // guaranteed to fall before or after that moment.
          if (lastSettled && s.uploaded_at && new Date(s.uploaded_at) <= new Date(lastSettled)) return; // already covered by a prior "mark settled"
          if (!owedByPartner.has(h.splitPartnerId)) owedByPartner.set(h.splitPartnerId, { owed: 0, undecidedCount: 0 });
          const entry = owedByPartner.get(h.splitPartnerId);
          if (a.elevatorPaidShareOnly == null) { entry.undecidedCount++; return; }
          if (a.elevatorPaidShareOnly === true) return; // elevator already excluded the partner's share — nothing further owed
          const bu = (h._ticket && h._ticket.net_bushels) || 0;
          const haulValue = settlementBushels > 0 && s.total_amount != null ? (bu / settlementBushels) * s.total_amount : 0;
          entry.owed += haulValue * (h.splitPct / 100);
        });
      });
      let partnerCardsHtml = "";
      allPartners.forEach((p) => {
        const entry = owedByPartner.get(p.id);
        if (!entry || (entry.owed <= 0.01 && entry.undecidedCount === 0)) return;
        partnerCardsHtml += `
          <div class="dash-card">
            <div class="dash-card-title">Owed to ${escapeHtml(p.name)}</div>
            <div class="dash-big-num">${fmtUsd(entry.owed)}</div>
            <div class="meta">${entry.undecidedCount > 0 ? `${entry.undecidedCount} load${entry.undecidedCount === 1 ? "" : "s"} still need${entry.undecidedCount === 1 ? "s" : ""} a decision — see Settlements` : "estimated, prorated by bushels within each settlement"}</div>
            ${entry.owed > 0.01 ? `<button class="small-btn gold" style="margin-top:8px;" data-mark-settled="${p.id}" data-owed="${entry.owed}">Mark settled</button>` : ""}
          </div>`;
      });

      html += `
        <div class="dash-section-title" style="margin-top:24px;">Right now</div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-card-title">Open contracts</div>
            <div class="dash-big-num">${openContracts.length}</div>
            <div class="meta">${fmtBu(totalContractedDelivered)} / ${fmtBu(totalContracted)} delivered against them</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-title">Unpaid settlements</div>
            <div class="dash-big-num">${fmtUsd(unpaidTotal)}</div>
            <div class="meta">${unpaidSettlements.length} outstanding</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-title">AI readings needing review</div>
            <div class="dash-big-num">${reviewQueueCount}</div>
            <div class="meta">flagged, not yet marked reviewed</div>
          </div>
          ${partnerCardsHtml}
        </div>`;

      // ---- Bin inventory — right now, not period-scoped. Reads
      // bin_levels directly, the same live-computed view Deliveries
      // already uses for bin selection, so these numbers match exactly
      // what a driver sees when picking a bin. Sorted client-side rather
      // than relying on the query's own ordering. ----
      const { data: binRows, error: binErr } = await supabase.from("bin_levels").select("*");
      const activeBins = (binRows || []).filter((b) => b.active !== false).sort((a, b) => (a.site || "").localeCompare(b.site || "") || (a.name || "").localeCompare(b.name || ""));
      const binRowsHtml = activeBins
        .map((b) => {
          const pct = b.pct || 0;
          const statusCell = b.status ? `<span class="badge badge-${b.status}">${escapeHtml(b.status)}</span>` : "—";
          const splitCell = b.split_partner_id ? `${escapeHtml(partnerName(b.split_partner_id))} ${b.split_pct}%` : "—";
          return `
            <tr>
              <td>${escapeHtml(b.site || "—")}</td>
              <td>${escapeHtml(b.name || "—")}</td>
              <td>${escapeHtml(b.crop || "—")}</td>
              <td>${statusCell}</td>
              <td>${splitCell}</td>
              <td>${Number(b.bushels_in_bin || 0).toLocaleString()} bu</td>
              <td>${b.capacity_k_bu != null ? (b.capacity_k_bu * 1000).toLocaleString() + " bu" : "—"}</td>
              <td><div class="progress-track" style="width:90px;display:inline-block;vertical-align:middle;"><div class="progress-fill" style="width:${Math.min(100, pct)}%;"></div></div> <span style="margin-left:6px;">${pct}%</span></td>
            </tr>`;
        })
        .join("");
      html += `<div class="dash-section-title" style="margin-top:24px;">Bin inventory — right now</div>`;
      html +=
        activeBins.length === 0
          ? `<div style="color:var(--text-muted);font-size:13px;">No bins on file.</div>`
          : `<table style="margin-bottom:8px;">
              <thead><tr>
                <th style="cursor:default;">Site</th><th style="cursor:default;">Bin</th><th style="cursor:default;">Crop</th>
                <th style="cursor:default;">Status</th><th style="cursor:default;">Split</th>
                <th style="cursor:default;">Bushels</th><th style="cursor:default;">Capacity</th><th style="cursor:default;">Fill</th>
              </tr></thead>
              <tbody>${binRowsHtml}</tbody>
            </table>`;

      if (ctErr) html += `<div style="color:var(--danger);font-size:12px;margin-top:10px;">Could not load contract assignments for the dollar estimate: ${escapeHtml(ctErr.message)}</div>`;
      if (psErr) html += `<div style="color:var(--danger);font-size:12px;margin-top:10px;">Could not load partner settlement history: ${escapeHtml(psErr.message)}</div>`;
      if (binErr) html += `<div style="color:var(--danger);font-size:12px;margin-top:10px;">Could not load bin inventory: ${escapeHtml(binErr.message)}</div>`;

      dashContentEl.innerHTML = html;
      dashContentEl.querySelectorAll("[data-mark-settled]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const partnerId = Number(btn.dataset.markSettled);
          const amount = Number(btn.dataset.owed);
          const { error } = await supabase.from("partner_settlements").insert({ partner_id: partnerId, amount });
          if (error) { alert("Could not mark settled: " + error.message); return; }
          await renderDashboard();
        });
      });
    }

    function fmtVal(v) {
      if (v == null || v === "") return null;
      return typeof v === "number" ? v.toLocaleString() : String(v);
    }

    // Whether the AI itself tagged a specific field as flagged (structured
    // — the AI's tool schema requires it to name the field an issue
    // concerns — not guessed from keywords in free text).
    function fieldIsFlagged(read, key) {
      return Array.isArray(read.legibility_issues) && read.legibility_issues.some((i) => i && i.field === key);
    }
    // A saved correction for one field, normalized to {value, at} — buyer
    // reads its own dedicated columns (a compound name+location pair,
    // already deployed); every other field reads the generic JSONB blob.
    function getFieldCorrection(read, key) {
      if (key === "buyer") {
        return read.buyer_override_name ? { value: [read.buyer_override_name, read.buyer_override_location].filter(Boolean).join(" — "), at: read.buyer_override_at } : null;
      }
      const c = read.field_corrections && read.field_corrections[key];
      return c ? { value: c.value, at: c.corrected_at } : null;
    }
    // Where a suggested correction comes from, when one exists at all:
    // buyer suggests the haul's own destination (chosen by the driver
    // independent of the photo); any field the driver ALSO enters
    // suggests the driver's own value (more reliable than a partial AI
    // read); every other AI-only field has no trustworthy alternate
    // source, so it's manual-entry only — no "smart" guessing.
    function getFieldSuggestion(f, r, t) {
      if (f.key === "buyer") return r.destinationName ? { value: [r.destinationName, r.destinationLocation].filter(Boolean).join(" — "), source: "this haul's own destination" } : null;
      if (f.d) {
        const v = fmtVal(f.d(t));
        return v != null ? { value: v, source: "the driver's own entry" } : null;
      }
      return null;
    }

    function buildFieldCorrectionRow(r, read, t, f) {
      const row = document.createElement("div");
      row.className = "field-correction-row";
      row.style.gridColumn = "1 / -1";
      const corrected = getFieldCorrection(read, f.key);

      if (corrected) {
        const note = document.createElement("div");
        note.className = "meta";
        note.style.marginBottom = "6px";
        note.textContent = `Corrected to: ${corrected.value}${corrected.at ? " on " + new Date(corrected.at).toLocaleDateString() : ""}`;
        row.appendChild(note);
      } else {
        const suggestion = getFieldSuggestion(f, r, t);
        if (suggestion) {
          const sugRow = document.createElement("div");
          sugRow.style.cssText = "display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;";
          const sugText = document.createElement("span");
          sugText.style.fontSize = "13px";
          sugText.innerHTML = `Suggested: <span class="${f.key === "buyer" ? "ai-val" : "driver-val"}">${escapeHtml(suggestion.value)}</span> <span class="meta">— from ${escapeHtml(suggestion.source)}</span>`;
          sugRow.appendChild(sugText);
          const acceptBtn = document.createElement("button");
          acceptBtn.className = "small-btn gold";
          acceptBtn.textContent = "Accept";
          acceptBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (f.key === "buyer") setBuyerCorrection(read.id, r.destinationName, r.destinationLocation);
            else setFieldCorrection(read.id, read.field_corrections, f.key, suggestion.value);
          });
          sugRow.appendChild(acceptBtn);
          row.appendChild(sugRow);
        }
      }

      const inputStyle = "font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);flex:1;min-width:140px;";
      const manualRow = document.createElement("div");
      manualRow.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center;";
      if (f.key === "buyer") {
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = "Buyer name";
        nameInput.value = read.buyer_override_name || "";
        nameInput.style.cssText = inputStyle;
        const locInput = document.createElement("input");
        locInput.type = "text";
        locInput.placeholder = "Location";
        locInput.value = read.buyer_override_location || "";
        locInput.style.cssText = inputStyle;
        const saveBtn = document.createElement("button");
        saveBtn.className = "small-btn";
        saveBtn.textContent = "Save correction";
        saveBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setBuyerCorrection(read.id, nameInput.value.trim() || null, locInput.value.trim() || null);
        });
        manualRow.append(nameInput, locInput, saveBtn);
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = f.label;
        input.value = corrected ? corrected.value : "";
        input.style.cssText = inputStyle;
        const saveBtn = document.createElement("button");
        saveBtn.className = "small-btn";
        saveBtn.textContent = "Save correction";
        saveBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setFieldCorrection(read.id, read.field_corrections, f.key, input.value.trim() || null);
        });
        manualRow.append(input, saveBtn);
      }
      row.appendChild(manualRow);
      return row;
    }

    function buildDetailPanel(r) {
      const t = r._ticket || {};
      const read = r._read || {};
      const wrap = document.createElement("div");
      wrap.innerHTML = `
        <div style="display:flex;gap:16px;margin-bottom:10px;">
          <span class="legend-chip"><span class="legend-dot" style="background:var(--driver-blue);"></span>Driver entered</span>
          <span class="legend-chip"><span class="legend-dot" style="background:var(--ai-yellow);"></span>AI read from photo</span>
        </div>
      `;
      const grid = document.createElement("div");
      grid.className = "detail-cols";
      grid.innerHTML = `<div class="dh">Field</div><div class="dh">Driver</div><div class="dh">AI reading</div>`;

      DETAIL_FIELDS.forEach((f) => {
        if (f.group) {
          const g = document.createElement("div");
          g.className = "dh";
          g.style.gridColumn = "1 / -1";
          g.style.marginTop = "6px";
          g.textContent = f.group;
          grid.appendChild(g);
          return;
        }
        const dv = f.d ? fmtVal(f.d(t)) : null;
        let av = f.a ? fmtVal(f.a(read)) : null;
        const flagged = f.key && r._read && fieldIsFlagged(read, f.key);
        const corrected = f.key ? getFieldCorrection(read, f.key) : null;
        if (corrected) av = corrected.value + " (corrected)";
        if (dv == null && av == null && !flagged && !corrected) return; // nothing either side captured, and nothing flagged — skip the row
        const lbl = document.createElement("div");
        lbl.className = "lbl";
        lbl.textContent = f.label;
        const dCell = document.createElement("div");
        dCell.className = dv != null ? "driver-val" : "empty";
        dCell.textContent = dv != null ? dv : "—";
        const aCell = document.createElement("div");
        aCell.className = av != null ? "ai-val" : "empty";
        aCell.textContent = av != null ? av : "—";
        grid.appendChild(lbl);
        grid.appendChild(dCell);
        grid.appendChild(aCell);

        // A correction prompt for exactly this field, right where it's
        // relevant — not a generic list at the bottom the person has to
        // match back up to the row it concerns.
        if (f.key && r._read && r._read.id != null && (flagged || corrected)) {
          grid.appendChild(buildFieldCorrectionRow(r, read, t, f));
        }
      });
      wrap.appendChild(grid);

      if (r.photoPath) {
        const btn = document.createElement("button");
        btn.className = "photo-link";
        btn.style.marginTop = "12px";
        btn.textContent = "View photo";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          showPhoto(r.photoPath, btn);
        });
        wrap.appendChild(btn);
      }

      // A flagged reading can be marked as checked by a human — it stays
      // flagged in the underlying data (the math/AI record doesn't change),
      // it just stops showing as needing attention. Only shown when there's
      // an actual ticket_reads row to toggle (r._read has its id).
      if (r._read && r._read.id != null && (r.checkStatus === "review" || r.checkStatus === "reviewed")) {
        const reviewWrap = document.createElement("div");
        reviewWrap.style.cssText = "margin-top:12px;display:flex;align-items:center;gap:10px;";
        if (r.checkStatus === "reviewed") {
          const note = document.createElement("span");
          note.className = "meta";
          note.textContent = `Reviewed${r._read.reviewed_at ? " on " + new Date(r._read.reviewed_at).toLocaleDateString() : ""}`;
          reviewWrap.appendChild(note);
          const undoBtn = document.createElement("button");
          undoBtn.className = "small-btn";
          undoBtn.textContent = "Undo (needs review again)";
          undoBtn.addEventListener("click", (e) => { e.stopPropagation(); setReadReviewed(r._read.id, false); });
          reviewWrap.appendChild(undoBtn);
        } else {
          const markBtn = document.createElement("button");
          markBtn.className = "small-btn gold";
          markBtn.textContent = "Mark reviewed";
          markBtn.addEventListener("click", (e) => { e.stopPropagation(); setReadReviewed(r._read.id, true); });
          reviewWrap.appendChild(markBtn);
        }
        wrap.appendChild(reviewWrap);
      }
      return wrap;
    }

    async function setReadReviewed(readId, reviewed) {
      const { error } = await supabase
        .from("ticket_reads")
        .update({ reviewed, reviewed_at: reviewed ? new Date().toISOString() : null })
        .eq("id", readId);
      if (error) { alert("Could not update: " + error.message); return; }
      await fetchHauls();
      render();
    }

    // Accepting a suggestion or saving a manual correction also marks the
    // reading reviewed — fixing the buyer is itself a completed review.
    async function setBuyerCorrection(readId, name, location) {
      const { error } = await supabase
        .from("ticket_reads")
        .update({ buyer_override_name: name, buyer_override_location: location, buyer_override_at: new Date().toISOString(), reviewed: true, reviewed_at: new Date().toISOString() })
        .eq("id", readId);
      if (error) { alert("Could not save correction: " + error.message); return; }
      await fetchHauls();
      render();
    }

    // Generic version of setBuyerCorrection, for every other field. Merges
    // into field_corrections client-side from the currently-loaded value
    // (currentCorrections, straight from the last fetchHauls()) rather than
    // a read-then-write round trip — fine for a single-admin tool like this.
    async function setFieldCorrection(readId, currentCorrections, key, value) {
      const updated = { ...(currentCorrections || {}) };
      if (value == null || value === "") delete updated[key];
      else updated[key] = { value, corrected_at: new Date().toISOString() };
      const { error } = await supabase
        .from("ticket_reads")
        .update({ field_corrections: updated, reviewed: true, reviewed_at: new Date().toISOString() })
        .eq("id", readId);
      if (error) { alert("Could not save correction: " + error.message); return; }
      await fetchHauls();
      render();
    }

    function renderHaulsTable() {
      const search = searchEl.value.trim().toLowerCase();
      const statusFilter = statusFilterEl.value;
      let rows = allHauls.filter((r) => {
        if (statusFilter && r.originStatus !== statusFilter) return false;
        if (!search) return true;
        return [r.driver, r.origin, r.destination, r.ticketNumber].some((v) => (v || "").toLowerCase().includes(search));
      });
      rows = [...rows].sort((a, b) => {
        const av = a[haulSortKey] ?? "";
        const bv = b[haulSortKey] ?? "";
        const cmp = av < bv ? -1 : av > bv ? 1 : 0;
        return haulSortDir === "asc" ? cmp : -cmp;
      });

      haulsRowsEl.innerHTML = "";
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.className = "haul-row";
        const expanded = expandedHauls.has(r.haulId);
        const time = r.departed_at ? new Date(r.departed_at).toLocaleString() : "—";
        const checkBadge = `<span class="badge badge-${r.checkStatus}">${escapeHtml(r.checkLabel)}</span>`;
        const ticketMismatch = r.aiTicketNumber && r.ticketNumber !== "—" && r.aiTicketNumber !== r.ticketNumber && r.aiTicketComplete !== false;
        const aiNetCell = ticketMismatch ? `${escapeHtml(r.aiNet)} <span title="AI read ticket #${escapeHtml(r.aiTicketNumber)}, driver entered ${escapeHtml(r.ticketNumber)}" style="color:var(--danger);">⚠</span>` : escapeHtml(r.aiNet);
        tr.innerHTML = `
          <td>${expanded ? "▾" : "▸"} ${time}</td>
          <td>${escapeHtml(r.driver)}</td>
          <td>${escapeHtml(r.origin)}</td>
          <td>${escapeHtml(r.destination)}</td>
          <td>${escapeHtml(r.rig)}</td>
          <td>${escapeHtml(r.ticketNumber)}</td>
          <td class="driver-val">${escapeHtml(r.driverNet)}</td>
          <td class="ai-val">${aiNetCell}</td>
          <td>${checkBadge}</td>
          <td>${r.photoPath ? `<button class="photo-link" data-path="${escapeHtml(r.photoPath)}">View photo</button>` : "—"}</td>
        `;
        if (r.arithmeticCheck && r.arithmeticCheck.startsWith("fail")) tr.title = r.arithmeticCheck;
        tr.addEventListener("click", (e) => {
          if (e.target.closest(".photo-link")) return; // let the photo button's own handler run instead
          if (expandedHauls.has(r.haulId)) expandedHauls.delete(r.haulId);
          else expandedHauls.add(r.haulId);
          renderHaulsTable();
        });
        haulsRowsEl.appendChild(tr);

        if (expanded) {
          const detailTr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 10;
          td.className = "haul-detail-cell";
          td.appendChild(buildDetailPanel(r));
          detailTr.appendChild(td);
          haulsRowsEl.appendChild(detailTr);
        }
      });
      haulsRowsEl.querySelectorAll(".photo-link[data-path]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          showPhoto(btn.dataset.path, btn);
        });
      });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s == null ? "" : String(s);
      return div.innerHTML;
    }

    // Restore session on reload rather than forcing a fresh login every time.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      showLog();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
