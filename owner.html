<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrainChain — Load Log</title>
  <style>
    :root {
      --ink: #171B1E; --panel: #1F2529; --panel-alt: #262D32; --border: #343B40;
      --gold: #D4A017; --gold-dark: #3A2F0E; --text: #F4F1E9; --text-muted: #9AA2A8;
      --organic: #5C8A3A; --organic-dark: #1D2A13;
      --transitional: #B08F5A; --transitional-dark: #2F2717;
      --conventional: #6B7480; --conventional-dark: #20242A;
      --danger: #C0453A;
      --driver-blue: #5AA9E6; --driver-blue-dark: #12283A;
      --ai-yellow: #E8C547; --ai-yellow-dark: #332C0C;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); min-height: 100%; }
    body { font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-family: 'Bahnschrift','DIN Alternate','Arial Narrow',sans-serif; color: var(--gold); }
    #login-view { display: flex; flex-direction: column; gap: 16px; max-width: 360px; margin: 80px auto; padding: 0 20px; }
    #login-view input {
      font-size: 16px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
    }
    #login-view button {
      font-size: 16px; font-weight: 700; padding: 12px; border-radius: 8px;
      border: 1px solid var(--gold); background: var(--gold-dark); color: var(--gold); cursor: pointer;
    }
    #login-error { color: var(--danger); font-size: 13px; min-height: 16px; }
    #log-view { display: none; padding: 24px; }
    #log-view.visible { display: block; }
    #login-view.hidden { display: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .topbar button { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; position: sticky; top: 0; background: var(--ink); cursor: pointer; user-select: none; }
    th:hover { color: var(--gold); }
    tbody tr:hover { background: var(--panel); }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .badge-organic { color: var(--organic); background: var(--organic-dark); }
    .badge-transitional { color: var(--transitional); background: var(--transitional-dark); }
    .badge-conventional { color: var(--conventional); background: var(--conventional-dark); }
    .badge-match { color: var(--organic); background: var(--organic-dark); }
    .badge-review { color: #E2812B; background: #3A250D; }
    .badge-reviewed { color: var(--driver-blue); background: var(--driver-blue-dark); }
    .suggestion-box { border: 1px solid var(--gold); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 13px; background: var(--panel); }
    .suggestion-box .accepted { color: var(--organic); }
    .field-correction-row { margin: 4px 0 10px; padding: 8px 0 8px 12px; border-left: 2px solid var(--gold); }
    .badge-none { color: var(--text-muted); background: var(--panel-alt); }
    .photo-link { color: var(--gold); font-size: 12px; text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; }
    .driver-val { color: var(--driver-blue); }
    .ai-val { color: var(--ai-yellow); }
    .haul-row { cursor: pointer; }
    .haul-row:hover { background: var(--panel); }
    .haul-detail-cell { background: var(--panel); padding: 16px 20px !important; white-space: normal; }
    .detail-cols { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 4px 16px; font-size: 13px; align-items: baseline; }
    .detail-cols .dh { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .detail-cols .lbl { color: var(--text-muted); }
    .detail-cols .empty { color: var(--border); }
    .legend-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .entry-form { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .entry-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
    .entry-form input, .entry-form select, .entry-form textarea {
      font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-family: inherit;
    }
    .item-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .item-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; cursor: pointer; }
    .item-card .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .progress-track { background: var(--panel); border-radius: 999px; height: 8px; width: 160px; overflow: hidden; margin-top: 6px; }
    .progress-fill { background: var(--gold); height: 100%; }
    .item-detail { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
    .ticket-pick-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
    .ticket-pick-row:last-child { border-bottom: none; }
    .small-btn { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
    .small-btn.gold { border-color: var(--gold); background: var(--gold-dark); color: var(--gold); }
    .badge-paid { color: var(--organic); background: var(--organic-dark); }
    .badge-unpaid { color: #E2812B; background: #3A250D; }
    .dash-section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .dash-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .dash-card-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
    .dash-stat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 2px; }
    .dash-big-num { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    #table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    #status-line { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
    #filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    #filter-row input, #filter-row select {
      font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
    }
    .view-btn {
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); cursor: pointer;
    }
    .view-btn.active-view { border-color: var(--gold); background: var(--gold-dark); color: var(--gold); }
  </style>
</head>
<body>
  <div id="login-view">
    <h1 style="font-size:24px;margin:0;">GrainChain — Load Log</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="login-error"></div>
    <button id="login-btn">Log in</button>
  </div>

  <div id="log-view">
    <div class="topbar">
      <h1 style="font-size:22px;margin:0;">GrainChain — Load Log</h1>
      <button id="logout-btn">Log out</button>
    </div>
    <div id="filter-row">
      <input id="search" type="text" placeholder="Search field, worker, bin..." style="flex:1;min-width:200px;" />
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="organic">Organic</option>
        <option value="transitional">Transitional</option>
        <option value="conventional">Conventional</option>
      </select>
      <button id="view-dashboard-btn" class="view-btn">Dashboard</button>
      <button id="view-loads-btn" class="view-btn active-view">Field to Bin</button>
      <button id="view-field-btn" class="view-btn">By Field</button>
      <button id="view-hauls-btn" class="view-btn">Hauls &amp; Tickets</button>
      <button id="view-contracts-btn" class="view-btn">Contracts</button>
      <button id="view-settlements-btn" class="view-btn">Settlements</button>
      <button id="refresh-btn" style="border:1px solid var(--border);background:var(--panel-alt);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;">Refresh</button>
    </div>
    <div id="status-line">Loading…</div>
    <div id="table-wrap">
      <table id="loads-table">
        <thead>
          <tr>
            <th data-sort="logged_at">Time</th>
            <th data-sort="worker">Worker</th>
            <th data-sort="field">Field</th>
            <th data-sort="crop">Crop</th>
            <th data-sort="status">Status</th>
            <th data-sort="truck">Truck</th>
            <th data-sort="load">Load</th>
            <th data-sort="moisture">Moisture</th>
            <th data-sort="test_weight">Test Wt</th>
            <th data-sort="bin">Bin</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <table id="field-table" style="display:none;">
        <thead>
          <tr>
            <th data-fsort="field">Field</th>
            <th data-fsort="crop">Crop</th>
            <th data-fsort="status">Status</th>
            <th data-fsort="count">Loads</th>
            <th data-fsort="totalBushels">Total Bushels</th>
            <th data-fsort="avgMoisture">Avg Moisture</th>
            <th data-fsort="avgTestWeight">Avg Test Wt</th>
          </tr>
        </thead>
        <tbody id="field-rows"></tbody>
      </table>
      <table id="hauls-table" style="display:none;">
        <thead>
          <tr>
            <th data-hsort="departed_at">Departed</th>
            <th data-hsort="driver">Driver</th>
            <th data-hsort="origin">From</th>
            <th data-hsort="destination">To</th>
            <th data-hsort="rig">Truck/Trailer</th>
            <th data-hsort="ticketNumber">Ticket #</th>
            <th data-hsort="driverNet">Driver entry</th>
            <th data-hsort="aiNet">AI reading</th>
            <th data-hsort="checkStatus">Check</th>
            <th>Photo</th>
          </tr>
        </thead>
        <tbody id="hauls-rows"></tbody>
      </table>

      <div id="contracts-view" style="display:none;">
        <button id="add-contract-btn" class="view-btn" style="margin-bottom:14px;">+ Add contract</button>
        <div id="contract-form" class="entry-form" style="display:none;">
          <div class="form-grid">
            <label>Crop<select id="cf-crop"><option>Corn</option><option>Soybeans</option></select></label>
            <label>Sale type<select id="cf-sale-type"><option value="organic">Organic</option><option value="conventional">Conventional</option><option value="non_gmo">Non-GMO</option></select></label>
            <label>Bushels<input id="cf-bushels" type="number" step="any" /></label>
            <label>Contract #<input id="cf-number" type="text" /></label>
            <label>Buyer<select id="cf-destination"></select></label>
            <label>Contract date<input id="cf-date" type="date" /></label>
            <label>Delivery period<input id="cf-period" type="text" placeholder="e.g. Oct 2026" /></label>
            <label>Futures price<input id="cf-futures" type="number" step="any" /></label>
            <label>Basis<input id="cf-basis" type="number" step="any" /></label>
            <label>Cash price<input id="cf-cash" type="number" step="any" /></label>
          </div>
          <label style="display:block;margin-top:10px;">Notes<textarea id="cf-notes" rows="2" style="width:100%;"></textarea></label>
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button id="cf-save" class="view-btn active-view">Save contract</button>
            <button id="cf-cancel" class="view-btn">Cancel</button>
          </div>
        </div>
        <div id="contracts-list"></div>
      </div>

      <div id="settlements-view" style="display:none;">
        <button id="add-settlement-btn" class="view-btn" style="margin-bottom:14px;">+ Upload settlement</button>
        <div id="settlement-form" class="entry-form" style="display:none;">
          <div class="form-grid">
            <label>Buyer<select id="sf-destination"></select></label>
            <label>Settlement date<input id="sf-date" type="date" /></label>
            <label>Total amount ($)<input id="sf-amount" type="number" step="any" /></label>
            <label>Document (photo or PDF)<input id="sf-file" type="file" accept="image/*,application/pdf" /></label>
          </div>
          <label style="display:block;margin-top:10px;">Notes<textarea id="sf-notes" rows="2" style="width:100%;"></textarea></label>
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button id="sf-save" class="view-btn active-view">Save settlement</button>
            <button id="sf-cancel" class="view-btn">Cancel</button>
          </div>
        </div>
        <div id="settlements-list"></div>
      </div>

      <div id="dashboard-view" style="display:none;">
        <div id="dash-period-row" style="display:flex;gap:8px;margin-bottom:16px;">
          <button id="dash-day-btn" class="view-btn active-view" data-period="day">Day</button>
          <button id="dash-week-btn" class="view-btn" data-period="week">Last 7 days</button>
          <button id="dash-month-btn" class="view-btn" data-period="month">Last 30 days</button>
          <button id="dash-ytd-btn" class="view-btn" data-period="ytd">YTD</button>
        </div>
        <div id="dash-content"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // TODO: same Project URL / anon key as index.html.
    const supabase = createClient(
      "https://ewzlxjimbxwurzbjzbxw.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3emx4amltYnh3dXJ6Ymp6Ynh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDA4NDksImV4cCI6MjEwNTMxNjg0OX0.wJTPNqDP07_129K_90X-SOb4oji8ZENWi4S9L0xjGQk"
    );

    const loginView = document.getElementById("login-view");
    const logView = document.getElementById("log-view");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const loginError = document.getElementById("login-error");
    const statusLine = document.getElementById("status-line");
    const rowsEl = document.getElementById("rows");
    const fieldRowsEl = document.getElementById("field-rows");
    const loadsTable = document.getElementById("loads-table");
    const fieldTable = document.getElementById("field-table");
    const viewLoadsBtn = document.getElementById("view-loads-btn");
    const viewFieldBtn = document.getElementById("view-field-btn");
    const viewHaulsBtn = document.getElementById("view-hauls-btn");
    const haulsTable = document.getElementById("hauls-table");
    const haulsRowsEl = document.getElementById("hauls-rows");
    const viewContractsBtn = document.getElementById("view-contracts-btn");
    const viewSettlementsBtn = document.getElementById("view-settlements-btn");
    const viewDashboardBtn = document.getElementById("view-dashboard-btn");
    const dashboardView = document.getElementById("dashboard-view");
    const dashContentEl = document.getElementById("dash-content");
    const contractsView = document.getElementById("contracts-view");
    const settlementsView = document.getElementById("settlements-view");
    const contractsListEl = document.getElementById("contracts-list");
    const settlementsListEl = document.getElementById("settlements-list");
    const searchEl = document.getElementById("search");
    const statusFilterEl = document.getElementById("status-filter");
    const refreshBtn = document.getElementById("refresh-btn");

    let allLoads = [];
    let allHauls = [];
    let haulsLoaded = false;
    let haulSortKey = "departed_at";
    let haulSortDir = "desc";
    const expandedHauls = new Set();

    let allDestinations = [];
    let allPartners = [];
    let allContracts = [];
    let allSettlements = [];
    let contractsLoaded = false, settlementsLoaded = false;
    const expandedContracts = new Set();
    const expandedSettlements = new Set();
    let dashboardPeriod = "day"; // "day" | "week" | "month" | "ytd" — week/month are rolling 7/30 days, not calendar

    // organic contract  <- organic-status hauls of that crop
    // conventional      <- conventional OR transitional hauls of that crop
    //                      (buffer grain is already conventional-status by
    //                      the time it's a haul, so no separate case needed)
    // non_gmo           <- transitional hauls of that crop
    function eligibleForContract(haul, contract) {
      if (haul.crop !== contract.crop) return false;
      if (contract.sale_type === "organic") return haul.originStatus === "organic";
      if (contract.sale_type === "conventional") return haul.originStatus === "conventional" || haul.originStatus === "transitional";
      if (contract.sale_type === "non_gmo") return haul.originStatus === "transitional";
      return false;
    }

    // Every field either side can capture. `d` reads from the driver's
    // ticket row, `a` from the AI's reading of the photo — both optional,
    // since most fields only exist on one side. Grouped for readability.
    const DETAIL_FIELDS = [
      { group: "Ticket" },
      { key: "ticket_number", label: "Ticket number", d: (t) => t.ticket_number, a: (r) => (r.ticket_number ? r.ticket_number + (r.ticket_number_complete === false ? " (partial — covered/cut off)" : "") : null) },
      { key: "buyer", label: "Buyer", a: (r) => [r.buyer_name, r.buyer_location].filter(Boolean).join(" — ") },
      { key: "ticket_date", label: "Ticket date", a: (r) => r.ticket_date },
      { key: "commodity", label: "Commodity", a: (r) => r.commodity },
      { group: "Weight" },
      { key: "gross_lb", label: "Gross (lb)", d: (t) => t.gross_lb, a: (r) => r.gross_lb },
      { key: "tare_lb", label: "Tare (lb)", d: (t) => t.tare_lb, a: (r) => r.tare_lb },
      { key: "net_lb", label: "Net (lb)", d: (t) => t.net_lb, a: (r) => r.net_lb },
      { key: "gross_time", label: "Gross time", a: (r) => r.gross_time },
      { key: "tare_time", label: "Tare time", a: (r) => r.tare_time },
      { group: "Bushels" },
      { key: "gross_bu", label: "Gross (bu)", a: (r) => r.gross_bu },
      { key: "shrink_bu", label: "Shrink (bu)", a: (r) => r.shrink_bu },
      { key: "net_bu", label: "Net (bu)", d: (t) => t.net_bushels, a: (r) => r.net_bu },
      { group: "Grading" },
      { key: "moisture_pct", label: "Moisture %", d: (t) => t.moisture_pct, a: (r) => r.moisture_pct },
      { key: "test_weight", label: "Test weight", d: (t) => t.test_weight, a: (r) => r.test_weight },
      { key: "foreign_material_pct", label: "Foreign material %", a: (r) => r.foreign_material_pct },
      { key: "damage_pct", label: "Damage %", a: (r) => r.damage_pct },
      { key: "heat_damage_pct", label: "Heat damage %", a: (r) => r.heat_damage_pct },
      { group: "Other" },
      { key: "vehicle_id_printed", label: "Vehicle ID (printed)", a: (r) => r.vehicle_id_printed },
      { key: "bol", label: "BOL", a: (r) => r.bol },
      {
        key: "owner_splits",
        label: "Owner splits",
        a: (r) => (Array.isArray(r.owner_splits) && r.owner_splits.length ? r.owner_splits.map((o) => `${o.name}: ${o.pct != null ? o.pct + "%" : ""} ${o.net_lb != null ? "— " + o.net_lb.toLocaleString() + " lb" : ""} ${o.net_bu != null ? "/ " + o.net_bu + " bu" : ""}`).join("; ") : null),
      },
      { label: "Driver's notes", d: (t) => t.notes }, // driver-only; nothing for the AI to misread here, so no key/correction
      { key: "handwritten_notes", label: "Handwritten on ticket", a: (r) => r.handwritten_notes },
      { group: "AI read" },
      { label: "Legibility issues", a: (r) => (Array.isArray(r.legibility_issues) && r.legibility_issues.length ? r.legibility_issues.map((i) => `${i.field}: ${i.note}`).join("; ") : null) },
      { label: "Arithmetic check", a: (r) => r.arithmetic_check },
      { label: "Cleaning affidavit", a: (r) => (r.cleaning_affidavit ? `${r.cleaning_affidavit.present ? "Present" : "Not shown"}${r.cleaning_affidavit.signed ? ", signed" : ""}${r.cleaning_affidavit.date_filled ? " " + r.cleaning_affidavit.date_filled : ""}` : null) },
      { label: "Read at", a: (r) => (r.read_at ? new Date(r.read_at).toLocaleString() : null) },
    ];
    // label -> key, so the correction UI can find a field's driver-side
    // accessor (`d`) by key without a second lookup table.
    const FIELD_BY_KEY = Object.fromEntries(DETAIL_FIELDS.filter((f) => f.key).map((f) => [f.key, f]));

    let sortKey = "logged_at";
    let sortDir = "desc";
    let viewMode = "loads"; // "loads" | "field"
    let fieldSortKey = "field";
    let fieldSortDir = "asc";

    // Same crop-standard bushel weights used in the bin_levels view, so
    // totals here agree with what the kiosk/bin fill % are computed from.
    const CROP_STANDARD_LB_PER_BU = { Corn: 56, Soybeans: 60, Oats: 32 };
    function toBushels(l) {
      if (l.bushels_raw != null) return l.bushels_raw;
      if (l.weight_lb_raw != null) {
        const factor = l.test_weight_raw || CROP_STANDARD_LB_PER_BU[l.crop_raw] || 56;
        return l.weight_lb_raw / factor;
      }
      return 0;
    }

    function showLogin() {
      loginView.classList.remove("hidden");
      logView.classList.remove("visible");
    }
    function showLog() {
      loginView.classList.add("hidden");
      logView.classList.add("visible");
      fetchLoads();
    }

    loginBtn.addEventListener("click", async () => {
      loginError.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = error.message;
        return;
      }
      showLog();
    });

    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    refreshBtn.addEventListener("click", fetchLoads);
    searchEl.addEventListener("input", render);
    statusFilterEl.addEventListener("change", render);

    const VIEW_BTNS = { loads: viewLoadsBtn, field: viewFieldBtn, hauls: viewHaulsBtn, contracts: viewContractsBtn, settlements: viewSettlementsBtn, dashboard: viewDashboardBtn };
    const VIEW_ELS = { loads: loadsTable, field: fieldTable, hauls: haulsTable, contracts: contractsView, settlements: settlementsView, dashboard: dashboardView };

    async function ensureContracts() {
      if (!contractsLoaded) { await ensureDestinations(); await ensureHauls(); await fetchContracts(); }
    }
    async function ensureSettlements() {
      if (!settlementsLoaded) { await ensureDestinations(); await ensureHauls(); await ensurePartners(); await fetchSettlements(); }
    }
    async function ensureLoads() {
      if (allLoads.length === 0) await fetchLoads();
    }

    async function switchView(mode) {
      viewMode = mode;
      Object.entries(VIEW_BTNS).forEach(([k, btn]) => btn.classList.toggle("active-view", k === mode));
      Object.entries(VIEW_ELS).forEach(([k, el]) => (el.style.display = k === mode ? "" : "none"));
      // Search/status-filter apply to the three ticket/load tables, not the
      // card-based contracts/settlements/dashboard views.
      const showFilters = mode === "loads" || mode === "field" || mode === "hauls";
      searchEl.style.display = showFilters ? "" : "none";
      statusFilterEl.style.display = showFilters ? "" : "none";

      if (mode === "hauls" && !haulsLoaded) await fetchHauls();
      if (mode === "contracts") await ensureContracts();
      if (mode === "settlements") await ensureSettlements();
      if (mode === "dashboard") {
        await Promise.all([ensureLoads(), ensureHauls(), ensureContracts(), ensureSettlements()]);
        await renderDashboard();
        return; // renderDashboard draws dash-content itself; skip the generic render() below
      }
      render();
    }

    document.querySelectorAll("#dash-period-row button[data-period]").forEach((btn) => {
      btn.addEventListener("click", () => {
        dashboardPeriod = btn.dataset.period;
        document.querySelectorAll("#dash-period-row button[data-period]").forEach((b) => b.classList.toggle("active-view", b === btn));
        renderDashboard();
      });
    });

    viewLoadsBtn.addEventListener("click", () => switchView("loads"));
    viewFieldBtn.addEventListener("click", () => switchView("field"));
    viewHaulsBtn.addEventListener("click", () => switchView("hauls"));
    viewContractsBtn.addEventListener("click", () => switchView("contracts"));
    viewSettlementsBtn.addEventListener("click", () => switchView("settlements"));
    viewDashboardBtn.addEventListener("click", () => switchView("dashboard"));

    document.querySelectorAll("th[data-hsort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.hsort;
        if (haulSortKey === key) {
          haulSortDir = haulSortDir === "asc" ? "desc" : "asc";
        } else {
          haulSortKey = key;
          haulSortDir = "desc";
        }
        render();
      });
    });

    document.querySelectorAll("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDir = "desc";
        }
        render();
      });
    });

    document.querySelectorAll("th[data-fsort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.fsort;
        if (fieldSortKey === key) {
          fieldSortDir = fieldSortDir === "asc" ? "desc" : "asc";
        } else {
          fieldSortKey = key;
          fieldSortDir = key === "field" ? "asc" : "desc";
        }
        render();
      });
    });

    async function fetchLoads() {
      statusLine.textContent = "Loading…";
      const { data, error } = await supabase
        .from("loads")
        .select("*, fields(name, crop, status), bins(name), workers(name)")
        .order("logged_at", { ascending: false })
        .limit(1000);
      if (error) {
        statusLine.textContent = "Error loading: " + error.message;
        return;
      }
      allLoads = data.map((l) => ({
        logged_at: l.logged_at,
        worker: l.workers?.name || l.worker_id,
        field: l.fields?.name || l.field_id,
        crop: l.crop || l.fields?.crop || "—",
        status: l.is_buffer ? "conventional" : l.fields?.status || null,
        truck: l.truck ? `Truck ${l.truck}` : "Buffer truck",
        load: l.bushels != null ? `${l.bushels.toLocaleString()} bu` : l.weight_lb != null ? `${l.weight_lb.toLocaleString()} lb (est.)` : "—",
        moisture: l.moisture_pct != null ? `${l.moisture_pct}%` : "—",
        test_weight: l.test_weight != null ? `${l.test_weight} lb/bu` : "—",
        bin: l.bins?.name || l.bin_id,
        // raw numeric values, kept alongside the display strings above, for
        // the By Field totals/averages
        bushels_raw: l.bushels,
        weight_lb_raw: l.weight_lb,
        moisture_raw: l.moisture_pct,
        test_weight_raw: l.test_weight,
        crop_raw: l.crop || l.fields?.crop || null,
      }));
      statusLine.textContent = `${allLoads.length} load${allLoads.length === 1 ? "" : "s"}`;
      render();
    }

    function render() {
      const search = searchEl.value.trim().toLowerCase();
      const statusFilter = statusFilterEl.value;

      let rows = allLoads.filter((r) => {
        if (statusFilter && r.status !== statusFilter) return false;
        if (!search) return true;
        return [r.worker, r.field, r.bin, r.crop].some((v) => (v || "").toLowerCase().includes(search));
      });

      if (viewMode === "loads") {
        renderLoadsTable(rows);
      } else if (viewMode === "field") {
        renderFieldSummary(rows);
      } else if (viewMode === "hauls") {
        renderHaulsTable();
      } else if (viewMode === "contracts") {
        renderContracts();
      } else if (viewMode === "settlements") {
        renderSettlements();
      }
    }

    function renderLoadsTable(rows) {
      rows = [...rows].sort((a, b) => {
        const av = a[sortKey] ?? "";
        const bv = b[sortKey] ?? "";
        const cmp = av < bv ? -1 : av > bv ? 1 : 0;
        return sortDir === "asc" ? cmp : -cmp;
      });

      rowsEl.innerHTML = "";
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        const time = r.logged_at ? new Date(r.logged_at).toLocaleString() : "—";
        const statusBadge = r.status
          ? `<span class="badge badge-${r.status}">${r.status[0].toUpperCase()}${r.status.slice(1)}</span>`
          : "—";
        tr.innerHTML = `
          <td>${time}</td>
          <td>${escapeHtml(r.worker)}</td>
          <td>${escapeHtml(r.field)}</td>
          <td>${escapeHtml(r.crop)}</td>
          <td>${statusBadge}</td>
          <td>${escapeHtml(r.truck)}</td>
          <td>${escapeHtml(r.load)}</td>
          <td>${escapeHtml(r.moisture)}</td>
          <td>${escapeHtml(r.test_weight)}</td>
          <td>${escapeHtml(r.bin)}</td>
        `;
        rowsEl.appendChild(tr);
      });
    }

    function renderFieldSummary(rows) {
      const byField = new Map();
      rows.forEach((r) => {
        if (!byField.has(r.field)) {
          byField.set(r.field, {
            field: r.field,
            crop: r.crop,
            status: r.status,
            count: 0,
            totalBushels: 0,
            moistureSum: 0,
            moistureCount: 0,
            testWeightSum: 0,
            testWeightCount: 0,
          });
        }
        const g = byField.get(r.field);
        g.count += 1;
        g.totalBushels += toBushels(r);
        if (r.moisture_raw != null) {
          g.moistureSum += r.moisture_raw;
          g.moistureCount += 1;
        }
        if (r.test_weight_raw != null) {
          g.testWeightSum += r.test_weight_raw;
          g.testWeightCount += 1;
        }
      });

      let summary = Array.from(byField.values()).map((g) => ({
        ...g,
        avgMoisture: g.moistureCount ? g.moistureSum / g.moistureCount : null,
        avgTestWeight: g.testWeightCount ? g.testWeightSum / g.testWeightCount : null,
      }));

      summary.sort((a, b) => {
        const av = a[fieldSortKey] ?? "";
        const bv = b[fieldSortKey] ?? "";
        const cmp = av < bv ? -1 : av > bv ? 1 : 0;
        return fieldSortDir === "asc" ? cmp : -cmp;
      });

      fieldRowsEl.innerHTML = "";
      summary.forEach((g) => {
        const tr = document.createElement("tr");
        const statusBadge = g.status
          ? `<span class="badge badge-${g.status}">${g.status[0].toUpperCase()}${g.status.slice(1)}</span>`
          : "—";
        tr.innerHTML = `
          <td>${escapeHtml(g.field)}</td>
          <td>${escapeHtml(g.crop)}</td>
          <td>${statusBadge}</td>
          <td>${g.count}</td>
          <td>${g.totalBushels.toLocaleString(undefined, { maximumFractionDigits: 0 })} bu</td>
          <td>${g.avgMoisture != null ? g.avgMoisture.toFixed(1) + "%" : "—"}</td>
          <td>${g.avgTestWeight != null ? g.avgTestWeight.toFixed(1) + " lb/bu" : "—"}</td>
        `;
        fieldRowsEl.appendChild(tr);
      });
    }

    async function fetchHauls() {
      statusLine.textContent = "Loading…";
      const [shipRes, tkRes, readRes] = await Promise.all([
        supabase.from("shipments").select("*, bins(name), fields(name), destinations(name, location), workers(name)").order("departed_at", { ascending: false }).limit(500),
        supabase.from("shipment_tickets").select("*").order("created_at", { ascending: false }).limit(1000),
        supabase.from("ticket_reads").select("*").order("read_at", { ascending: false }).limit(1000),
      ]);
      if (shipRes.error) { statusLine.textContent = "Error loading: " + shipRes.error.message; return; }

      // Newest ticket per haul, newest AI read per ticket — same "latest
      // wins, history stays in the table" rule the app itself uses.
      const newestTicket = new Map();
      (tkRes.data || []).forEach((t) => {
        const cur = newestTicket.get(t.shipment_client_id);
        if (!cur || t.created_at > cur.created_at) newestTicket.set(t.shipment_client_id, t);
      });
      const newestRead = new Map();
      (readRes.data || []).forEach((r) => {
        if (!r.ticket_client_id) return;
        const cur = newestRead.get(r.ticket_client_id);
        if (!cur || r.read_at > cur.read_at) newestRead.set(r.ticket_client_id, r);
      });

      allHauls = (shipRes.data || []).map((s) => {
        const ticket = newestTicket.get(s.client_id) || null;
        const read = ticket ? newestRead.get(ticket.client_id) : null;
        const origin = s.origin_type === "field" ? `${s.fields?.name || s.field_id || "—"} (field)` : s.bins?.name || s.bin_id || "—";
        const destination = s.destination_name || s.destinations?.name || s.destination_id || "—";
        const destLoc = (s.destination_location || s.destinations?.location || "").split(",")[0].trim();

        let checkStatus = "none", checkLabel = "No ticket yet";
        if (ticket && !read) { checkStatus = "review"; checkLabel = "Waiting on AI read"; }
        else if (ticket && read?.error) { checkStatus = "review"; checkLabel = "AI read failed"; }
        else if (ticket && read) {
          const netClose = read.net_lb == null || ticket.net_lb == null || Math.abs(read.net_lb - ticket.net_lb) <= Math.max(50, ticket.net_lb * 0.01);
          const buClose = read.net_bu == null || ticket.net_bushels == null || Math.abs(read.net_bu - ticket.net_bushels) <= Math.max(1, ticket.net_bushels * 0.01);
          if (read.needs_review || !netClose || !buClose) { checkStatus = "review"; checkLabel = "Needs review"; }
          else { checkStatus = "match"; checkLabel = "Matches driver entry"; }
        }
        // A human can mark a flagged reading as checked — it stays flagged
        // by the math/AI (that record shouldn't change), but stops showing
        // as needing attention. "Waiting on AI read" has no read row yet
        // (nothing to mark reviewed), so this only applies to the other two.
        if (checkStatus === "review" && read && read.reviewed) {
          checkStatus = "reviewed";
          checkLabel = "Reviewed";
        }

        return {
          haulId: s.client_id,
          crop: s.crop,
          originType: s.origin_type,
          splitPartnerId: s.split_partner_id,
          splitPct: s.split_pct,
          destinationId: s.destination_id,
          destinationName: destination, // full buyer name — the suggested-correction source for a partially-cut-off AI buyer reading
          destinationLocation: s.destination_location || s.destinations?.location || null, // full location, not the abbreviated destLoc used for display
          departed_at: s.departed_at,
          driver: s.workers?.name || s.worker_id,
          origin, originStatus: s.origin_status,
          destination: destLoc ? `${destination} (${destLoc})` : destination,
          rig: s.truck ? `Truck ${s.truck} · ${s.trailer}` : s.trailer,
          ticketNumber: ticket?.ticket_number || "—",
          driverNet: ticket ? `${ticket.net_lb != null ? ticket.net_lb.toLocaleString() + " lb" : "—"} / ${ticket.net_bushels != null ? ticket.net_bushels.toLocaleString() + " bu" : "—"}` : "—",
          aiNet: read && !read.error ? `${read.net_lb != null ? read.net_lb.toLocaleString() + " lb" : "—"} / ${read.net_bu != null ? read.net_bu.toLocaleString() + " bu" : "—"}` : read?.error ? "Read failed" : "—",
          aiTicketNumber: read?.ticket_number || null,
          aiTicketComplete: read?.ticket_number_complete,
          checkStatus, checkLabel,
          arithmeticCheck: read?.arithmetic_check || null,
          photoPath: ticket?.photo_path || null,
          // Full raw records, for the expanded field-by-field detail panel.
          _ticket: ticket,
          _read: read,
        };
      });
      haulsLoaded = true;
      statusLine.textContent = `${allHauls.length} haul${allHauls.length === 1 ? "" : "s"}`;
    }

    async function showPhoto(path, btn, bucket = "scale-tickets") {
      const label = btn.textContent;
      btn.textContent = "Loading…";
      const { data, error } = await supabase.storage.from(bucket).createSignedUrl(path, 3600);
      if (error) { btn.textContent = "Could not load document"; return; }
      window.open(data.signedUrl, "_blank", "noopener");
      btn.textContent = label;
    }

    // =====================================================================
    // Contracts & Settlements
    // =====================================================================

    async function ensureDestinations() {
      if (allDestinations.length) return;
      const { data, error } = await supabase.from("destinations").select("*").order("name");
      if (!error) allDestinations = data || [];
      populateDestinationSelects();
    }
    async function ensureHauls() {
      if (!haulsLoaded) await fetchHauls();
    }
    async function ensurePartners() {
      if (allPartners.length) return;
      const { data, error } = await supabase.from("partners").select("*").order("name");
      if (!error) allPartners = data || [];
    }
    function partnerName(id) {
      const p = allPartners.find((x) => x.id === id);
      return p ? p.name : "Partner";
    }
    function destName(id) {
      const d = allDestinations.find((x) => x.id === id);
      if (!d) return id || "—";
      return d.location ? `${d.name} (${d.location})` : d.name;
    }
    function populateDestinationSelects() {
      const opts = allDestinations
        .map((d) => `<option value="${escapeHtml(d.id)}">${escapeHtml(destName(d.id))}</option>`)
        .join("");
      const cfSel = document.getElementById("cf-destination");
      const sfSel = document.getElementById("sf-destination");
      if (cfSel) cfSel.innerHTML = opts;
      if (sfSel) sfSel.innerHTML = opts;
    }

    function pickRow(text, btnLabel, onClick, tone = "") {
      const row = document.createElement("div");
      row.className = "ticket-pick-row";
      const span = document.createElement("span");
      span.style.flex = "1";
      span.textContent = text;
      row.appendChild(span);
      const btn = document.createElement("button");
      btn.className = `small-btn ${tone}`.trim();
      btn.textContent = btnLabel;
      btn.addEventListener("click", onClick);
      row.appendChild(btn);
      return row;
    }
    function haulSummary(h) {
      if (!h) return "(load not found)";
      const ticketPart = h.ticketNumber && h.ticketNumber !== "—" ? `#${h.ticketNumber} · ` : "";
      return `${ticketPart}${h.driver} · ${h.origin} · ${h.driverNet}`;
    }

    // ---------------- Contracts ----------------

    async function fetchContracts() {
      statusLine.textContent = "Loading…";
      const [cRes, ctRes] = await Promise.all([
        supabase.from("contract_progress").select("*").order("contract_date", { ascending: false }),
        supabase.from("contract_tickets").select("*"),
      ]);
      if (cRes.error) { statusLine.textContent = "Error loading: " + cRes.error.message; return; }
      const byContract = new Map();
      (ctRes.data || []).forEach((row) => {
        if (!byContract.has(row.contract_id)) byContract.set(row.contract_id, []);
        byContract.get(row.contract_id).push({ id: row.id, shipmentClientId: row.shipment_client_id, bushels: row.bushels });
      });
      // A haul's own list of allocations, across ALL contracts — a load
      // split between an old contract and a new one shows up here twice.
      allContracts = (cRes.data || []).map((c) => ({ ...c, assignments: byContract.get(c.id) || [] }));
      contractsLoaded = true;
      statusLine.textContent = `${allContracts.length} contract${allContracts.length === 1 ? "" : "s"}`;
    }

    // How many bushels of a haul are still unallocated to any contract —
    // its ticket's full net bushels, minus whatever's already been given
    // out across every contract's assignments (not just this one).
    function haulRemainingBushels(h) {
      const total = (h._ticket && h._ticket.net_bushels) || 0;
      const allocated = allContracts.reduce(
        (sum, c) => sum + c.assignments.filter((a) => a.shipmentClientId === h.haulId).reduce((s, a) => s + a.bushels, 0),
        0
      );
      return Math.max(0, total - allocated);
    }

    async function assignToContract(haulId, contractId, bushels) {
      const { error } = await supabase.from("contract_tickets").insert({ contract_id: contractId, shipment_client_id: haulId, bushels });
      if (error) { alert("Could not assign: " + error.message); return; }
      await fetchContracts();
      render();
    }
    async function unassignFromContract(contractTicketId) {
      const { error } = await supabase.from("contract_tickets").delete().eq("id", contractTicketId);
      if (error) { alert("Could not remove: " + error.message); return; }
      await fetchContracts();
      render();
    }

    // A row offering to assign PART OR ALL of a haul's remaining bushels
    // to this contract — pre-filled with whichever is smaller: what's
    // left of the haul, or what this contract still needs — but editable,
    // so a load can be split across two contracts deliberately.
    function buildAssignRow(h, c, remaining) {
      const contractNeed = Math.max(0, c.bushels - c.delivered_bushels);
      const suggested = Math.round(Math.min(remaining, contractNeed || remaining) * 100) / 100;

      const row = document.createElement("div");
      row.className = "ticket-pick-row";
      const span = document.createElement("span");
      span.style.flex = "1";
      span.textContent = `${haulSummary(h)} — ${remaining.toLocaleString()} bu remaining`;
      row.appendChild(span);
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = suggested || "";
      input.style.cssText = "width:90px;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);";
      row.appendChild(input);
      const btn = document.createElement("button");
      btn.className = "small-btn gold";
      btn.textContent = "Assign";
      btn.addEventListener("click", () => {
        const amt = Number(input.value);
        if (!(amt > 0)) { alert("Enter how many bushels to assign."); return; }
        if (amt > remaining + 0.001) { alert(`Only ${remaining.toLocaleString()} bu of this haul is still unallocated.`); return; }
        assignToContract(h.haulId, c.id, Math.round(amt * 100) / 100);
      });
      row.appendChild(btn);
      return row;
    }

    function renderContracts() {
      contractsListEl.innerHTML = "";
      if (allContracts.length === 0) {
        contractsListEl.innerHTML = `<div style="color:var(--text-muted);font-size:13px;">No contracts yet — click "+ Add contract" above.</div>`;
        return;
      }
      allContracts.forEach((c) => {
        const pct = c.bushels > 0 ? Math.min(100, Math.round((c.delivered_bushels / c.bushels) * 100)) : 0;
        const expanded = expandedContracts.has(c.id);
        const saleLabel = c.sale_type === "non_gmo" ? "Non-GMO" : c.sale_type.charAt(0).toUpperCase() + c.sale_type.slice(1);

        const card = document.createElement("div");
        card.className = "item-card";
        const head = document.createElement("div");
        head.className = "item-card-head";
        head.innerHTML = `
          <div style="flex:1;">
            <div style="font-weight:600;">${expanded ? "▾" : "▸"} ${escapeHtml(c.crop)} · ${escapeHtml(saleLabel)}${c.contract_number ? ` <span class="meta">#${escapeHtml(c.contract_number)}</span>` : ""}</div>
            <div class="meta">${escapeHtml(destName(c.destination_id))}${c.delivery_period ? " · " + escapeHtml(c.delivery_period) : ""}${c.cash_price != null ? " · $" + c.cash_price + "/bu" : ""}</div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
            <div class="meta">${Number(c.delivered_bushels).toLocaleString()} / ${Number(c.bushels).toLocaleString()} bu (${pct}%) — ${c.ticket_count} load${c.ticket_count === 1 ? "" : "s"}</div>
          </div>
        `;
        head.addEventListener("click", () => {
          if (expandedContracts.has(c.id)) expandedContracts.delete(c.id);
          else expandedContracts.add(c.id);
          renderContracts();
        });
        card.appendChild(head);

        if (expanded) {
          const detail = document.createElement("div");
          detail.className = "item-detail";
          if (c.notes) {
            const n = document.createElement("div");
            n.className = "meta";
            n.style.marginBottom = "8px";
            n.textContent = c.notes;
            detail.appendChild(n);
          }

          const assignedLabel = document.createElement("div");
          assignedLabel.style.cssText = "font-size:12px;color:var(--text-muted);margin-bottom:6px;";
          assignedLabel.textContent = `Assigned loads (${c.assignments.length})`;
          detail.appendChild(assignedLabel);
          if (c.assignments.length === 0) {
            const none = document.createElement("div");
            none.className = "meta";
            none.textContent = "None yet.";
            detail.appendChild(none);
          } else {
            c.assignments.forEach((a) => {
              const h = allHauls.find((x) => x.haulId === a.shipmentClientId);
              const fullBu = h && h._ticket ? h._ticket.net_bushels : null;
              // Only spell out "N bu of an M bu ticket" when it's actually
              // a partial slice — a whole-load allocation just reads as
              // the normal summary, same as before this feature existed.
              const label = fullBu != null && Math.abs(fullBu - a.bushels) > 0.001
                ? `${haulSummary(h)} — ${a.bushels.toLocaleString()} bu of this ${fullBu.toLocaleString()} bu ticket`
                : haulSummary(h);
              detail.appendChild(pickRow(label, "Remove", () => unassignFromContract(a.id)));
            });
          }

          const eligible = allHauls.filter((h) => h.checkStatus !== "none" && eligibleForContract(h, c) && haulRemainingBushels(h) > 0.001);
          const pickLabel = document.createElement("div");
          pickLabel.style.cssText = "font-size:12px;color:var(--text-muted);margin:12px 0 6px;";
          pickLabel.textContent = `Eligible loads with bushels remaining (${eligible.length})`;
          detail.appendChild(pickLabel);
          if (eligible.length === 0) {
            const none = document.createElement("div");
            none.className = "meta";
            none.textContent = "None right now.";
            detail.appendChild(none);
          } else {
            eligible.forEach((h) => detail.appendChild(buildAssignRow(h, c, haulRemainingBushels(h))));

    async function fetchSettlements() {
      statusLine.textContent = "Loading…";
      const [sRes, stRes] = await Promise.all([
        supabase.from("settlements").select("*").order("settlement_date", { ascending: false }),
        supabase.from("settlement_tickets").select("*"),
      ]);
      if (sRes.error) { statusLine.textContent = "Error loading: " + sRes.error.message; return; }
      const byS = new Map();
      (stRes.data || []).forEach((row) => {
        if (!byS.has(row.settlement_id)) byS.set(row.settlement_id, []);
        byS.get(row.settlement_id).push({ id: row.id, shipmentClientId: row.shipment_client_id, elevatorPaidShareOnly: row.elevator_paid_share_only });
      });
      allSettlements = (sRes.data || []).map((s) => ({ ...s, assignments: byS.get(s.id) || [] }));
      settlementsLoaded = true;
      statusLine.textContent = `${allSettlements.length} settlement${allSettlements.length === 1 ? "" : "s"}`;
    }

      const { error } = await supabase.from("settlement_tickets").insert({ settlement_id: settlementId, shipment_client_id: haulId });
      if (error) { alert("Could not assign: " + error.message); return; }
      await fetchSettlements();
      render();

    async function unassignFromSettlement(settlementTicketId) {
      const { error } = await supabase.from("settlement_tickets").delete().eq("id", settlementTicketId);

    async function setSettlementPaid(id, paid, paidDateValue) {

      const { error } = await supabase.from("settlements").update(payload).eq("id", id);
      if (error) { alert("Could not update: " + error.message); return; }
      await fetchSettlements();
      render();

    // Decided per settlement, not per haul — the same haul could in theory
    // be assigned differently if it were ever moved to another settlement,
    // so this lives on the settlement_tickets row, not the haul itself.
    async function setElevatorPaidShareOnly(settlementTicketId, value) {
      const { error } = await supabase.from("settlement_tickets").update({ elevator_paid_share_only: value }).eq("id", settlementTicketId);
